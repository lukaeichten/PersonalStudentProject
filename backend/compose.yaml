# Local development database. Spring Boot starts and stops this
# automatically via spring-boot-docker-compose when the app runs.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: personalstudentproject
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
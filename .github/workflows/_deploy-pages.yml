# Reusable workflow: deploys a previously uploaded Pages artifact (see `upload-pages-artifact`) to GitHub Pages.
# The calling job must grant `pages: write` and `id-token: write`.

name: Deploy to GitHub Pages

on:
  workflow_call:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
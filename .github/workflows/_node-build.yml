# Reusable workflow: builds (and optionally lints) an npm project.
# Call it from another workflow with `uses: ./.github/workflows/_node-build.yml`.

name: Node Build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the npm project.
        type: string
        required: true
      node-version:
        description: Node.js version to install (empty = default of setup-node-project).
        type: string
        default: ""
      fetch-depth:
        description: Git history depth to check out (0 = full history).
        type: number
        default: 1
      lint:
        description: Run `npm run lint` before building.
        type: boolean
        default: false
      build-command:
        description: Command that builds the project.
        type: string
        default: npm run build
      upload-pages-artifact:
        description: Upload the build output as a GitHub Pages artifact.
        type: boolean
        default: false
      artifact-path:
        description: Build output directory, relative to working-directory.
        type: string
        default: build

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      - name: Lint
        if: inputs.lint
        run: npm run lint

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Upload Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
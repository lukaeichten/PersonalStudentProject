name: Documentation Change
description: Suggest a new documentation change or improvement.
title: "[Documentation]: "
labels: ["scope:documentation"]
assignees:
  - ByteLuka
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this documentation change form!
  - type: textarea
    id: general-info
    attributes:
      label: General Information
      description: Please provide a general overview of the documentation change you're suggesting.
      placeholder: Tell us what you want to change!
    validations:
      required: true
  - type: textarea
    id: detailed-description
    attributes:
      label: Detailed Description
      description: Please provide a detailed description of the documentation change you're suggesting. Include any relevant information, such as what it covers, why it's needed, what audience benefits from the change, and any potential impact.
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your suggestion.
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Use this field to add additional information
    validations:
      required: false
